<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dev Journal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; }
      .sub   { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; }
      .mono  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-weight: 500; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- linhas de grade sutis -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
  </g>

  <!-- barra de destaque lateral -->
  <rect x="0" y="0" width="8" height="360" fill="url(#accent)"/>

  <!-- ícone de livro/diário -->
  <g transform="translate(120, 108)">
    <rect x="0" y="0" width="128" height="150" rx="12" fill="#1E293B" stroke="url(#accent)" stroke-width="3"/>
    <rect x="0" y="0" width="20" height="150" rx="6" fill="url(#accent)"/>
    <line x1="44" y1="40" x2="104" y2="40" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="66" x2="104" y2="66" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="92" x2="86" y2="92" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="98" cy="118" r="12" fill="none" stroke="#34D399" stroke-width="5"/>
    <path d="M92 118 l4 4 l8 -9" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- textos -->
  <text x="300" y="150" class="title" font-size="72" fill="#F8FAFC">Dev Journal</text>
  <text x="302" y="200" class="sub" font-size="28" fill="#94A3B8">Diário de desenvolvimento — estudos, projetos e aprendizados reais</text>

  <!-- "prompt" mono -->
  <g transform="translate(302, 246)">
    <rect x="0" y="0" width="470" height="44" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="29" class="mono" font-size="20" fill="#60A5FA">$</text>
    <text x="40" y="29" class="mono" font-size="20" fill="#CBD5E1">git commit -m "estudo de hoje"</text>
  </g>
</svg>
