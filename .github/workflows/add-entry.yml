name: Registrar início de atividade

on:
  workflow_dispatch:
    inputs:
      activity_type:
        description: "O que você vai fazer hoje?"
        required: true
        type: choice
        options:
          - Estudar
          - Programar
          - Estudar e programar
          - Trabalhar
          - Trabalhar e estudar
          - Participar de aula na faculdade
          - Realizar atividade acadêmica
          - Trabalhar em uma API
          - Desenvolver projeto pessoal
          - Corrigir bugs
          - Criar testes
          - Documentar projeto
          - Revisar código
          - Atualizar portfólio ou GitHub
          - Outra atividade
      details:
        description: "Em que você vai trabalhar? (opcional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dev-journal-register
  cancel-in-progress: false

jobs:
  register-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Registrar data e horário de Brasília
        id: journal
        env:
          ACTIVITY_TYPE: ${{ inputs.activity_type }}
          DETAILS: ${{ inputs.details }}
        run: python scripts/add_entry.py

      - name: Criar commit da atividade
        env:
          COMMIT_TITLE: ${{ steps.journal.outputs.commit_title }}
        run: |
          git config user.name "TeuzLins"
          git config user.email "163695559+TeuzLins@users.noreply.github.com"
          git add journal/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para registrar."
            exit 0
          fi

          git commit -m "chore(journal): ${COMMIT_TITLE}"
          git push
