name: Registrar atividade automática

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar resumo da atividade real
        run: python scripts/record_activity.py

      - name: Criar commit somente se houver alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/activity/

          if git diff --cached --quiet; then
            echo "Nenhuma atividade nova para registrar."
            exit 0
          fi

          git commit -m "chore(activity): registrar resumo automático diário"
          git push
